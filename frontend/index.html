<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact Manager</title>
    <script>
      (function () {
        var themes = ['light', 'dark', 'google', 'claude', 'facebook', 'alaska', 'reddit',
            'yahoo', 'wikipedia', 'amazon'];
        var theme = null;
        try {
          theme = window.localStorage.getItem('contactManagerTheme');
        } catch (ignored) {
        }
        document.documentElement.setAttribute('data-theme',
            themes.indexOf(theme) === -1 ? 'light' : theme);
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
