# Embedded in-memory H2: schema and sample data are applied on every startup.
# The SQL scripts remain authoritative for the schema, so Hibernate must not
# generate or alter tables.
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql
spring.jpa.hibernate.ddl-auto=none

# Sessions should not stay open into view rendering.
spring.jpa.open-in-view=false
